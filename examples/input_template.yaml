# CIRV 하니스 호출 입력 템플릿 (§1.2 / §10)
# 이 파일을 채워 오케스트레이터(cirv-orchestrator)에 전달한다.

companies:            # 조사 대상 기업 리스트 (가능하면 법인 정식명/영문명/본사국가 병기)
  - "기업명 A (예: (주)엘지화학 / LG Chem, Ltd. / KR)"
  - "기업명 B"

items:                # 연관성 판정 기준이 되는 관심 아이템 리스트
  - "아이템 1 (예: 재조합 microbial transglutaminase / mTG)"
  - "아이템 2 (예: 효소적 올리고뉴클레오타이드 합성 / TdT)"

options:
  language: "ko"                 # 산출 언어 (기본 한국어, 출처 원문은 원어 유지)
  recency_window_months: 12      # '동향/뉴스'로 인정하는 최신성 기준
  min_sources_per_claim: 2       # 사실당 최소 출처 수 (핵심 사실 권장 2 이상)
  match_threshold: "중"          # 최종 리포트에 '연관'으로 올릴 최소 연관도 (상/중/하)
